name: Build & Release

# HOW TO MAKE A RELEASE
#   1. Set VERSION at the top of dcalc.py (e.g. VERSION = "1.0.1") and commit it.
#   2. Push a tag with the same number and a "v" in front:
#        git tag v1.0.1
#        git push origin v1.0.1
#   The workflow builds the three programs, starts each one as a check, and publishes them
#   with SHA256SUMS.txt as a GitHub Release. The check stops the release if a program is
#   broken, if gmpy2 is missing from it, or if the tag and VERSION differ.
#
# Running it by hand (Actions tab -> Run workflow) only builds and tests them: the files
# show up as artifacts on the run page, nothing is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # needed so the workflow can create the release & upload assets

env:
  APP_NAME: dcalc        # name of the executables, e.g. dcalc-linux-x64. Change it here if the program is renamed.
  SCRIPT: dcalc.py       # the single source file

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64.exe
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-latest        # Apple Silicon
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    # The Windows runner defaults to PowerShell; bash works on all three.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Name the executable
        run: echo "ASSET=$APP_NAME-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install mpmath gmpy2 pyinstaller

      # A terminal program: no --windowed, so Windows gives it a console.
      # gmpy2 reads its own package metadata when it is imported, so that has to be bundled too.
      - name: Build executable
        run: pyinstaller --onefile --clean --noconfirm --copy-metadata gmpy2 --name "$APP_NAME" "$SCRIPT"

      # PyInstaller puts the result in dist/. Rename it to a per-OS asset name.
      - name: Rename executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then src="dist/$APP_NAME.exe"; else src="dist/$APP_NAME"; fi
          mv "$src" "dist/$ASSET"
          ls -l dist

      # Run the real executable once, so a broken build never gets released.
      - name: Smoke test
        run: |
          exe="./dist/$ASSET"
          chmod +x "$exe"
          out="$("$exe" --no-prompt "0.1+0.2" </dev/null | tr -d '\r')"
          [ "$out" = "0.3" ] || { echo "decimal arithmetic: got '$out'"; exit 1; }
          out="$(echo "sqrt(-4)" | "$exe" --pipe | tr -d '\r')"
          [ "$out" = "2i" ] || { echo "mpmath (complex): got '$out'"; exit 1; }
          "$exe" --help | head -n 1

          # gmpy2 must really be inside (the second line of --version says which backend runs)
          ver="$("$exe" --version | tr -d '\r')"
          echo "$ver"
          echo "$ver" | grep -q "gmpy2 [0-9]" || { echo "gmpy2 is missing from the executable"; exit 1; }

          # a release tag has to match VERSION in the script
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            built="$(echo "$ver" | head -n 1 | awk '{print $NF}')"
            [ "$built" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME, but the script says VERSION $built"; exit 1; }
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')     # manual runs stop after the build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write checksums and release text
        run: |
          cd dist
          sha256sum */* | sed 's|  .*/|  |' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          cd ..
          cat > release_text.md <<EOF
          Executables for Windows, Linux and macOS. No Python needed.

          | System | File |
          | --- | --- |
          | Windows 10/11 (64-bit) | \`$APP_NAME-windows-x64.exe\` |
          | Linux (64-bit) | \`$APP_NAME-linux-x64\` |
          | macOS (Apple Silicon) | \`$APP_NAME-macos-arm64\` |

          On Linux and macOS: \`chmod +x <file>\`. The files are unsigned, see the README. \`SHA256SUMS.txt\` holds the checksums.
          EOF

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true
          body_path: release_text.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
